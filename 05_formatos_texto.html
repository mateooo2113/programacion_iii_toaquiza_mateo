<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formato de Texto</title>
</head>
<body>
    <h1>Formato de Texto</h1>
    <p><b>negrita</b></p>
    <p><i>cursiva</i></p>
    <p><u>subrayado</u></p>
    <p><sub>subíndice</sub></p>
    <p>superíndice_ H<sup>2</sup>O</p>
    <p>Subíndice: H<sub>2</sub>O</p>
    <p><mark>marcado</mark></p>
    <p><del>eliminado</del></p>
    <p><ins>insertado</ins></p>
    <p><small>pequeño</small></p>
    <p><big>grande</big></p>
    <p><strong>importante</strong></p>
    <p><em>énfasis</em></p>
    
</body>
</html>
