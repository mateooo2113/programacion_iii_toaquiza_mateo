<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decowood</title>
    <script>
        alert("Bienvenido al taller DecoWood al inicio de la pagina")
        console.log('Saludo desde el inicio de la pagina de DecoWood')
    </script>
</head>
<body>
    <h1>Incluir Javascript en la pagina de DecoWood</h1>
    <h2>Modo Inline</h2>
    <button onclick="alert('¡Tu pedido de muebles fue recibido!')">
        Mostrar Mensaje
    </button>
    <input type="text"
        oninput="console.log(this.value)"
        placeholder="Escribe el mueble que deseas..."
    >
    <input type="text"
        onchange="console.log('Pedido final guardado',this.value)"
        placeholder="Escribe el tipo de madera..."
    >

    <input type="text"
        onfocus="console.log('El cliente está escribiendo su pedido aquí')"
        onblur="console.log('Saliste del campo del pedido')"
        placeholder="Escribe tu nombre..."
    >
    <script src="01_incluir_mp_toaquiza_mateo.js"></script>


</body>
</html>
