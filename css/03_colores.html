<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores</title>
    <style>
        body {
            background-color: rgb(113, 197, 223);
        }
        h1 {
            color : red;
        }

        h2{
            color: #Ff0000;
        }

        h3{
            color: rgb(255, 0, 0);
        }

        h4{
            color: rgba(255, 0, 0);
        }

        h5{
            color: hsl(0, 100%, 50%);
        }
    </style>
</head>
<body>
<h1>Maneras de establecer colores</h1>
<h1>Por nombre de color</h1>
<h2>Hexadecimal</h2>
<h3>Por valor RGB</h3>
<h4>Por valor RGBA</h4>
<h5>Por valor HSL</h5>
</body>
</html>
