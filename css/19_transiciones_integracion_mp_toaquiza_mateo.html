

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">


    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>Decowood</title>


    <link rel="stylesheet" href="19_transiciones_integracion_mp_toaquiza_mateo.css">
</head>
<body>


    <header>
        <h1>Taller en Acción</h1>


        <p>
            Simulación de trabajo
            de la Carpintería DecoWood.
        </p>
    </header>


    <main>


        <section class="escena"
                 aria-label="Escena del taller animada">


            <div class="viruta viruta1"></div>
            <div class="viruta viruta2"></div>
            <div class="viruta viruta3"></div>
            <div class="viruta viruta4"></div>
            <div class="viruta viruta5"></div>


            <div class="sierra">
                <span aria-hidden="true">🪚</span>
                <p>Sierra</p>
            </div>


            <div class="alerta">
                ALERTA DE CORTE
            </div>


        </section>


        <section class="controles">


            <h2>Centro de producción</h2>


            <div class="panel">


                <article class="medidor-contenedor">


                    <h3>Medidor de Humedad</h3>


                    <div class="medidor"
                         aria-hidden="true">


                        <div class="pulso"></div>


                        <div class="centro"></div>


                    </div>


                </article>


                <article class="estado">


                    <h3>Estado del pedido</h3>


                    <p>
                        Corte de madera activo.
                    </p>


                    <p>
                        Herramienta: Sierra circular
                    </p>


                    <p>
                        Taller: DecoWood Quito
                    </p>


                </article>


            </div>


        </section>


    </main>


    <footer>
        <p>Simulador DecoWood - 2026</p>
    </footer>


</body>
</html>
